<script>
const D={"en": {"name": "Recording Transcription Editor", "tag": "On-device transcription & audio editing", "nprivacy": "Privacy", "nsupport": "Support", "nmarketing": "Overview", "updated": "Last updated: 2026-07-04", "mH": "Overview", "mBody": ["Record → transcribe → edit audio in one place, entirely on your device.", "On-device high-accuracy transcription with automatic speaker separation.", "Edit audio like text — delete a word to cut the matching audio.", "Non-destructive timeline: trim, split, reorder, fade, per-segment volume.", "Export lossless audio (Pro), transcripts, and vertical waveform video.", "No network, no upload, no account."], "pH": "Privacy Policy", "pBody": ["This app is designed to be private by default. It does not collect, store, or share any personal data.", "All processing — recording, transcription, speaker separation, and editing — runs entirely on your device. Your audio is never uploaded to any server.", "No account or sign-in is required. There is no analytics, advertising, or third-party tracking.", "The transcription and speaker-separation models are bundled inside the app and work offline; if a model is ever downloaded, only the model file is fetched — your audio is never sent.", "Recordings and edits are stored locally on your device (in the app's container). You can delete them at any time inside the app.", "Because we do not collect any data, there is no personal data to access, correct, or delete on our side.", "If this policy changes, the updated version will be posted on this page."], "sH": "Support", "sIntro": "Need help? Here are answers to common questions. You can also reach the developer directly (see Contact below).", "faq": [["Do I need an account?", "No. The app works fully offline and never requires sign-in."], ["Is my audio uploaded anywhere?", "No. All transcription and processing happen on-device; audio is never uploaded."], ["How do I edit audio by text?", "Transcribe a recording, then delete words in the transcript — the matching audio is cut. You can also trim, split, and reorder on the timeline."], ["What does Pro unlock?", "Unlimited-length transcription, text-based audio editing, and advanced export (WAV / loudness normalization / waveform video). Audio up to 30 seconds can use these for free."], ["Will editing change my original file?", "No. Editing is non-destructive; your original recording is never modified."]], "cH": "Contact", "cIntro": "Questions or feedback? Reach the developer here:"}, "zh-Hans": {"name": "录音转写编辑器", "tag": "设备本地转写与音频编辑", "nprivacy": "隐私政策", "nsupport": "技术支持", "nmarketing": "产品介绍", "updated": "最后更新：2026-07-04", "mH": "产品介绍", "mBody": ["把「录音 → 转文字 → 改音频」合成一件事，全程在你的设备上完成。", "设备本地高精度转写，自动区分说话人。", "像编辑文字一样改音频——删掉一个词，对应音频就被剪掉。", "非破坏性时间线：修剪、分割、重排、淡入淡出、逐段音量。", "导出无损音频（Pro）、转写文本与竖屏波形视频。", "不联网、不上传、无需账号。"], "pH": "隐私政策", "pBody": ["本 App 以「默认隐私」为原则设计，不收集、不存储、也不分享任何个人数据。", "全部处理——录音、转写、说话人分离与编辑——都在你的设备本地完成，你的音频永远不会上传到任何服务器。", "无需注册或登录。没有任何分析统计、广告或第三方追踪。", "转写与说话人分离模型已内置在 App 中并可离线使用；即使有模型需要下载，也只下载模型文件本身，绝不上传你的音频。", "录音与编辑仅保存在你设备本地（App 的容器内），你可以随时在 App 内删除。", "由于我们不收集任何数据，我们这边也不存在可供访问、更正或删除的个人数据。", "若本政策有变更，最新版本将发布在本页面。"], "sH": "技术支持", "sIntro": "需要帮助？以下是常见问题的解答。你也可以直接联系开发者（见下方「联系我」）。", "faq": [["需要账号吗？", "不需要。App 完全离线可用，从不要求登录。"], ["我的音频会被上传吗？", "不会。所有转写与处理都在设备本地完成，音频从不上传。"], ["怎么按文字改音频？", "先转写录音，再在文稿里删词——对应的音频就被剪掉；也可在时间线上修剪、分割、重排。"], ["Pro 解锁什么？", "无限时长转写、按文字改音频，以及专业导出（WAV / 响度归一化 / 波形视频）。30 秒以内的音频可免费使用这些功能。"], ["编辑会改动原始文件吗？", "不会。编辑是非破坏性的，原始录音永不被修改。"]], "cH": "联系我", "cIntro": "有问题或建议？可以在这里联系开发者："}, "zh-Hant": {"name": "錄音轉寫編輯器", "tag": "裝置本機轉寫與音訊編輯", "nprivacy": "隱私權政策", "nsupport": "技術支援", "nmarketing": "產品介紹", "updated": "最後更新：2026-07-04", "mH": "產品介紹", "mBody": ["把「錄音 → 轉文字 → 改音訊」合成一件事，全程在你的裝置上完成。", "裝置本機高精準度轉寫，自動區分說話者。", "像編輯文字一樣改音訊——刪掉一個詞，對應音訊就被剪掉。", "非破壞性時間軸：修剪、分割、重排、淡入淡出、逐段音量。", "匯出無損音訊（Pro）、轉寫文字與直式波形影片。", "不連網、不上傳、免帳號。"], "pH": "隱私權政策", "pBody": ["本 App 以「預設隱私」為原則設計，不收集、不儲存、也不分享任何個人資料。", "全部處理——錄音、轉寫、說話者分離與編輯——都在你的裝置本機完成，你的音訊永遠不會上傳到任何伺服器。", "免註冊或登入。沒有任何分析統計、廣告或第三方追蹤。", "轉寫與說話者分離模型已內建在 App 中並可離線使用；即使有模型需要下載，也只下載模型檔案本身，絕不上傳你的音訊。", "錄音與編輯僅儲存在你裝置本機（App 的容器內），你可以隨時在 App 內刪除。", "由於我們不收集任何資料，我們這邊也不存在可供存取、更正或刪除的個人資料。", "若本政策有變更，最新版本將發布在本頁面。"], "sH": "技術支援", "sIntro": "需要協助？以下是常見問題的解答。你也可以直接聯絡開發者（見下方「聯絡我」）。", "faq": [["需要帳號嗎？", "不需要。App 完全離線可用，從不要求登入。"], ["我的音訊會被上傳嗎？", "不會。所有轉寫與處理都在裝置本機完成，音訊從不上傳。"], ["怎麼依文字改音訊？", "先轉寫錄音，再在文稿裡刪詞——對應的音訊就被剪掉；也可在時間軸上修剪、分割、重排。"], ["Pro 解鎖什麼？", "無限時長轉寫、依文字改音訊，以及專業匯出（WAV / 響度正規化 / 波形影片）。30 秒以內的音訊可免費使用這些功能。"], ["編輯會改動原始檔案嗎？", "不會。編輯是非破壞性的，原始錄音永不被修改。"]], "cH": "聯絡我", "cIntro": "有問題或建議？可以在這裡聯絡開發者："}, "ja": {"name": "録音文字起こしエディタ", "tag": "端末内での文字起こしと音声編集", "nprivacy": "プライバシー", "nsupport": "サポート", "nmarketing": "概要", "updated": "最終更新：2026-07-04", "mH": "概要", "mBody": ["「録音 → 文字起こし → 音声編集」をひとつに、すべて端末内で完結。", "端末内の高精度文字起こしと、話者の自動分離。", "テキストのように音声を編集——単語を消すと、その部分の音声がカットされます。", "非破壊のタイムライン：トリム・分割・並べ替え・フェード・区間ごとの音量。", "無劣化音声（Pro）、文字、縦型の波形動画を書き出し。", "通信なし・アップロードなし・アカウント不要。"], "pH": "プライバシーポリシー", "pBody": ["本 App は「デフォルトでプライバシー保護」を原則に設計されており、いかなる個人データも収集・保存・共有しません。", "録音・文字起こし・話者分離・編集を含むすべての処理は端末内で実行され、音声がサーバーにアップロードされることはありません。", "アカウントやサインインは不要です。解析、広告、第三者トラッキングは一切ありません。", "文字起こしと話者分離のモデルは App に内蔵され、オフラインで動作します。モデルをダウンロードする場合でも取得されるのはモデルファイルのみで、音声が送信されることはありません。", "録音と編集は端末内（App のコンテナ）にのみ保存され、App 内でいつでも削除できます。", "当方はいかなるデータも収集しないため、当方側にアクセス・訂正・削除の対象となる個人データは存在しません。", "本ポリシーを変更する場合は、最新版を本ページに掲載します。"], "sH": "サポート", "sIntro": "お困りですか？よくある質問への回答です。開発者に直接ご連絡いただくこともできます（下記「お問い合わせ」参照）。", "faq": [["アカウントは必要ですか？", "いいえ。App は完全にオフラインで動作し、サインインは不要です。"], ["音声はどこかにアップロードされますか？", "いいえ。文字起こしと処理はすべて端末内で行われ、音声がアップロードされることはありません。"], ["テキストで音声を編集するには？", "録音を文字起こしし、文字を削除すると、その部分の音声がカットされます。タイムラインでトリム・分割・並べ替えも可能です。"], ["Pro で何が使えますか？", "時間無制限の文字起こし、テキストによる音声編集、プロ書き出し（WAV / ラウドネス正規化 / 波形動画）。30 秒以内の音声は無料で利用できます。"], ["編集で元のファイルは変わりますか？", "いいえ。編集は非破壊で、元の録音は変更されません。"]], "cH": "お問い合わせ", "cIntro": "ご質問やご意見は、こちらから開発者へ："}, "ko": {"name": "녹음 받아쓰기 편집기", "tag": "기기 내 변환 및 오디오 편집", "nprivacy": "개인정보", "nsupport": "지원", "nmarketing": "개요", "updated": "최종 업데이트: 2026-07-04", "mH": "개요", "mBody": ["‘녹음 → 텍스트 변환 → 오디오 편집’을 하나로, 모두 기기에서.", "기기 내 고정밀 변환과 화자 자동 분리.", "텍스트처럼 오디오 편집 — 단어를 지우면 해당 오디오가 잘립니다.", "비파괴 타임라인: 다듬기, 나누기, 재배열, 페이드, 구간별 음량.", "무손실 오디오(Pro), 텍스트, 세로형 파형 영상 내보내기.", "네트워크·업로드·계정 불필요."], "pH": "개인정보 처리방침", "pBody": ["이 앱은 ‘기본적으로 개인정보 보호’를 원칙으로 설계되었으며, 어떠한 개인정보도 수집·저장·공유하지 않습니다.", "녹음, 변환, 화자 분리, 편집을 포함한 모든 처리는 기기에서 이루어지며, 오디오가 서버로 업로드되지 않습니다.", "계정이나 로그인이 필요 없습니다. 분석, 광고, 제3자 추적이 전혀 없습니다.", "변환 및 화자 분리 모델은 앱에 내장되어 오프라인으로 동작합니다. 모델을 내려받는 경우에도 모델 파일만 가져올 뿐 오디오는 전송되지 않습니다.", "녹음과 편집은 기기 내(앱 컨테이너)에만 저장되며 앱에서 언제든지 삭제할 수 있습니다.", "당사는 어떠한 데이터도 수집하지 않으므로, 당사 측에 접근·정정·삭제할 개인정보가 존재하지 않습니다.", "본 방침이 변경되면 최신 버전을 이 페이지에 게시합니다."], "sH": "지원", "sIntro": "도움이 필요하신가요? 자주 묻는 질문에 대한 답변입니다. 개발자에게 직접 연락할 수도 있습니다(아래 ‘문의하기’ 참조).", "faq": [["계정이 필요한가요?", "아니요. 앱은 완전히 오프라인으로 동작하며 로그인이 필요 없습니다."], ["오디오가 어딘가로 업로드되나요?", "아니요. 변환과 처리는 모두 기기에서 이루어지며 오디오는 업로드되지 않습니다."], ["텍스트로 오디오를 편집하려면?", "녹음을 변환한 뒤 스크립트에서 단어를 지우면 해당 오디오가 잘립니다. 타임라인에서 다듬기·나누기·재배열도 가능합니다."], ["Pro는 무엇을 잠금 해제하나요?", "길이 제한 없는 변환, 텍스트 기반 오디오 편집, 프로 내보내기(WAV / 음량 정규화 / 파형 영상). 30초 이내 오디오는 무료로 사용할 수 있습니다."], ["편집하면 원본 파일이 바뀌나요?", "아니요. 편집은 비파괴 방식으로 원본 녹음은 변경되지 않습니다."]], "cH": "문의하기", "cIntro": "질문이나 의견이 있으신가요? 여기에서 개발자에게 연락하세요:"}, "de": {"name": "Aufnahme-Transkriptions-Editor", "tag": "Transkription & Audiobearbeitung auf dem Gerät", "nprivacy": "Datenschutz", "nsupport": "Support", "nmarketing": "Überblick", "updated": "Zuletzt aktualisiert: 2026-07-04", "mH": "Überblick", "mBody": ["Aufnehmen → transkribieren → Audio bearbeiten an einem Ort, vollständig auf dem Gerät.", "Hochpräzise Transkription auf dem Gerät mit automatischer Sprechertrennung.", "Audio wie Text bearbeiten – ein Wort löschen schneidet den passenden Ton.", "Nicht-destruktive Timeline: kürzen, teilen, umsortieren, Blenden, Lautstärke pro Abschnitt.", "Verlustfreies Audio (Pro), Transkripte und vertikales Wellenform-Video exportieren.", "Kein Netz, kein Upload, kein Konto."], "pH": "Datenschutzerklärung", "pBody": ["Diese App ist von Grund auf datenschutzfreundlich gestaltet. Sie erfasst, speichert oder teilt keinerlei personenbezogene Daten.", "Die gesamte Verarbeitung – Aufnahme, Transkription, Sprechertrennung und Bearbeitung – läuft vollständig auf deinem Gerät. Dein Audio wird niemals auf einen Server hochgeladen.", "Es ist kein Konto oder Login erforderlich. Es gibt keine Analyse, keine Werbung und kein Tracking durch Dritte.", "Die Modelle für Transkription und Sprechertrennung sind in der App enthalten und funktionieren offline; falls ein Modell heruntergeladen wird, wird nur die Modelldatei geladen – dein Audio wird nie gesendet.", "Aufnahmen und Bearbeitungen werden ausschließlich lokal auf deinem Gerät (im Container der App) gespeichert und können jederzeit in der App gelöscht werden.", "Da wir keine Daten erheben, gibt es auf unserer Seite keine personenbezogenen Daten, die zugänglich, korrigierbar oder löschbar wären.", "Änderungen dieser Erklärung werden auf dieser Seite veröffentlicht."], "sH": "Support", "sIntro": "Brauchst du Hilfe? Hier sind Antworten auf häufige Fragen. Du kannst den Entwickler auch direkt erreichen (siehe „Kontakt“ unten).", "faq": [["Brauche ich ein Konto?", "Nein. Die App funktioniert vollständig offline und erfordert nie eine Anmeldung."], ["Wird mein Audio irgendwohin hochgeladen?", "Nein. Transkription und Verarbeitung erfolgen auf dem Gerät; Audio wird nie hochgeladen."], ["Wie bearbeite ich Audio per Text?", "Transkribiere eine Aufnahme und lösche Wörter im Transkript – der passende Ton wird geschnitten. Auf der Timeline kannst du auch kürzen, teilen und umsortieren."], ["Was schaltet Pro frei?", "Transkription ohne Längenbegrenzung, textbasierte Audiobearbeitung und erweiterten Export (WAV / Lautheitsnormalisierung / Wellenform-Video). Audio bis 30 Sekunden ist kostenlos."], ["Ändert die Bearbeitung meine Originaldatei?", "Nein. Die Bearbeitung ist nicht-destruktiv; deine Originalaufnahme wird nie verändert."]], "cH": "Kontakt", "cIntro": "Fragen oder Feedback? Erreiche den Entwickler hier:"}, "fr": {"name": "Transcription et édition audio", "tag": "Transcription et édition audio sur l’appareil", "nprivacy": "Confidentialité", "nsupport": "Assistance", "nmarketing": "Aperçu", "updated": "Dernière mise à jour : 2026-07-04", "mH": "Aperçu", "mBody": ["Enregistrer → transcrire → éditer l’audio au même endroit, entièrement sur l’appareil.", "Transcription haute précision sur l’appareil avec séparation automatique des locuteurs.", "Éditez l’audio comme du texte — supprimez un mot pour couper l’audio correspondant.", "Timeline non destructive : rogner, diviser, réordonner, fondus, volume par segment.", "Exportez audio sans perte (Pro), transcriptions et vidéo de forme d’onde verticale.", "Sans réseau, sans envoi, sans compte."], "pH": "Politique de confidentialité", "pBody": ["Cette app est conçue pour être confidentielle par défaut. Elle ne collecte, ne stocke ni ne partage aucune donnée personnelle.", "Tout le traitement — enregistrement, transcription, séparation des locuteurs et édition — s’effectue entièrement sur votre appareil. Votre audio n’est jamais envoyé à un serveur.", "Aucun compte ni connexion n’est requis. Il n’y a aucune analyse, publicité ou suivi tiers.", "Les modèles de transcription et de séparation des locuteurs sont intégrés à l’app et fonctionnent hors ligne ; si un modèle est téléchargé, seul le fichier du modèle est récupéré — votre audio n’est jamais envoyé.", "Les enregistrements et les modifications sont stockés uniquement en local sur votre appareil (dans le conteneur de l’app) et peuvent être supprimés à tout moment dans l’app.", "Comme nous ne collectons aucune donnée, il n’existe de notre côté aucune donnée personnelle à consulter, corriger ou supprimer.", "En cas de modification, la version à jour sera publiée sur cette page."], "sH": "Assistance", "sIntro": "Besoin d’aide ? Voici des réponses aux questions fréquentes. Vous pouvez aussi contacter directement le développeur (voir « Contact » ci-dessous).", "faq": [["Faut-il un compte ?", "Non. L’app fonctionne entièrement hors ligne et ne demande jamais de connexion."], ["Mon audio est-il envoyé quelque part ?", "Non. La transcription et le traitement se font sur l’appareil ; l’audio n’est jamais envoyé."], ["Comment éditer l’audio par le texte ?", "Transcrivez un enregistrement, puis supprimez des mots dans la transcription — l’audio correspondant est coupé. Vous pouvez aussi rogner, diviser et réordonner sur la timeline."], ["Qu’est-ce que Pro débloque ?", "Transcription sans limite de durée, édition audio par le texte et export pro (WAV / normalisation du volume / vidéo de forme d’onde). L’audio jusqu’à 30 secondes est gratuit."], ["L’édition modifie-t-elle mon fichier d’origine ?", "Non. L’édition est non destructive ; votre enregistrement d’origine n’est jamais modifié."]], "cH": "Contact", "cIntro": "Des questions ou des retours ? Contactez le développeur ici :"}, "es": {"name": "Grabar, transcribir y editar", "tag": "Transcripción y edición de audio en el dispositivo", "nprivacy": "Privacidad", "nsupport": "Soporte", "nmarketing": "Descripción", "updated": "Última actualización: 2026-07-04", "mH": "Descripción", "mBody": ["Grabar → transcribir → editar audio en un solo lugar, todo en el dispositivo.", "Transcripción de alta precisión en el dispositivo con separación automática de hablantes.", "Edita el audio como texto: borra una palabra para cortar el audio correspondiente.", "Línea de tiempo no destructiva: recortar, dividir, reordenar, fundidos, volumen por segmento.", "Exporta audio sin pérdidas (Pro), transcripciones y video vertical de forma de onda.", "Sin red, sin subidas, sin cuenta."], "pH": "Política de privacidad", "pBody": ["Esta app está diseñada para ser privada de forma predeterminada. No recopila, almacena ni comparte ningún dato personal.", "Todo el procesamiento —grabación, transcripción, separación de hablantes y edición— se realiza por completo en tu dispositivo. Tu audio nunca se sube a ningún servidor.", "No se requiere cuenta ni inicio de sesión. No hay analíticas, publicidad ni rastreo de terceros.", "Los modelos de transcripción y separación de hablantes vienen integrados en la app y funcionan sin conexión; si se descarga un modelo, solo se obtiene el archivo del modelo: tu audio nunca se envía.", "Las grabaciones y ediciones se guardan solo localmente en tu dispositivo (en el contenedor de la app) y puedes eliminarlas en cualquier momento dentro de la app.", "Como no recopilamos ningún dato, no existe por nuestra parte ningún dato personal que consultar, corregir o eliminar.", "Si esta política cambia, la versión actualizada se publicará en esta página."], "sH": "Soporte", "sIntro": "¿Necesitas ayuda? Aquí tienes respuestas a preguntas frecuentes. También puedes contactar directamente al desarrollador (consulta «Contacto» abajo).", "faq": [["¿Necesito una cuenta?", "No. La app funciona totalmente sin conexión y nunca requiere iniciar sesión."], ["¿Se sube mi audio a algún sitio?", "No. La transcripción y el procesamiento ocurren en el dispositivo; el audio nunca se sube."], ["¿Cómo edito el audio con texto?", "Transcribe una grabación y borra palabras en la transcripción: se corta el audio correspondiente. También puedes recortar, dividir y reordenar en la línea de tiempo."], ["¿Qué desbloquea Pro?", "Transcripción sin límite de duración, edición de audio por texto y exportación pro (WAV / normalización de volumen / video de forma de onda). El audio de hasta 30 segundos es gratis."], ["¿La edición cambia mi archivo original?", "No. La edición es no destructiva; tu grabación original nunca se modifica."]], "cH": "Contacto", "cIntro": "¿Preguntas o comentarios? Contacta al desarrollador aquí:"}, "pt": {"name": "Gravar, transcrever e editar", "tag": "Transcrição e edição de áudio no aparelho", "nprivacy": "Privacidade", "nsupport": "Suporte", "nmarketing": "Visão geral", "updated": "Última atualização: 2026-07-04", "mH": "Visão geral", "mBody": ["Gravar → transcrever → editar áudio em um só lugar, tudo no aparelho.", "Transcrição de alta precisão no aparelho com separação automática de locutores.", "Edite o áudio como texto: apague uma palavra para cortar o áudio correspondente.", "Linha do tempo não destrutiva: aparar, dividir, reordenar, fades, volume por trecho.", "Exporte áudio sem perdas (Pro), transcrições e vídeo vertical de forma de onda.", "Sem rede, sem envio, sem conta."], "pH": "Política de Privacidade", "pBody": ["Este app foi projetado para ser privado por padrão. Ele não coleta, armazena nem compartilha nenhum dado pessoal.", "Todo o processamento — gravação, transcrição, separação de locutores e edição — ocorre inteiramente no seu aparelho. Seu áudio nunca é enviado a nenhum servidor.", "Não é necessário conta nem login. Não há análises, publicidade ou rastreamento de terceiros.", "Os modelos de transcrição e separação de locutores vêm embutidos no app e funcionam offline; se um modelo for baixado, apenas o arquivo do modelo é obtido — seu áudio nunca é enviado.", "Gravações e edições são armazenadas apenas localmente no seu aparelho (no contêiner do app) e podem ser excluídas a qualquer momento dentro do app.", "Como não coletamos nenhum dado, não existe do nosso lado nenhum dado pessoal para acessar, corrigir ou excluir.", "Se esta política mudar, a versão atualizada será publicada nesta página."], "sH": "Suporte", "sIntro": "Precisa de ajuda? Aqui estão respostas para perguntas frequentes. Você também pode falar diretamente com o desenvolvedor (veja «Contato» abaixo).", "faq": [["Preciso de uma conta?", "Não. O app funciona totalmente offline e nunca exige login."], ["Meu áudio é enviado para algum lugar?", "Não. A transcrição e o processamento acontecem no aparelho; o áudio nunca é enviado."], ["Como edito o áudio por texto?", "Transcreva uma gravação e apague palavras na transcrição — o áudio correspondente é cortado. Você também pode aparar, dividir e reordenar na linha do tempo."], ["O que o Pro desbloqueia?", "Transcrição sem limite de duração, edição de áudio por texto e exportação pro (WAV / normalização de volume / vídeo de forma de onda). Áudio de até 30 segundos é grátis."], ["A edição altera meu arquivo original?", "Não. A edição é não destrutiva; sua gravação original nunca é modificada."]], "cH": "Contato", "cIntro": "Dúvidas ou comentários? Fale com o desenvolvedor aqui:"}, "ru": {"name": "Запись, транскрипция, редактор", "tag": "Транскрипция и монтаж звука на устройстве", "nprivacy": "Конфиденциальность", "nsupport": "Поддержка", "nmarketing": "Обзор", "updated": "Обновлено: 2026-07-04", "mH": "Обзор", "mBody": ["Запись → транскрипция → монтаж звука в одном месте, полностью на устройстве.", "Высокоточная транскрипция на устройстве с автоматическим разделением говорящих.", "Редактируйте звук как текст — удалите слово, и соответствующий фрагмент вырезается.", "Неразрушающая шкала: обрезка, разделение, перестановка, фейды, громкость по сегментам.", "Экспорт аудио без потерь (Pro), текста и вертикального видео с осциллограммой.", "Без сети, без выгрузки, без аккаунта."], "pH": "Политика конфиденциальности", "pBody": ["Это приложение спроектировано конфиденциальным по умолчанию. Оно не собирает, не хранит и не передаёт никакие персональные данные.", "Вся обработка — запись, транскрипция, разделение говорящих и монтаж — выполняется полностью на вашем устройстве. Ваше аудио никогда не выгружается на сервер.", "Аккаунт или вход не требуются. Нет аналитики, рекламы и стороннего отслеживания.", "Модели транскрипции и разделения говорящих встроены в приложение и работают офлайн; если модель загружается, скачивается только файл модели — ваше аудио не отправляется.", "Записи и правки хранятся только локально на устройстве (в контейнере приложения) и могут быть удалены в любой момент в приложении.", "Поскольку мы не собираем никаких данных, с нашей стороны нет персональных данных для доступа, исправления или удаления.", "При изменении этой политики обновлённая версия будет опубликована на этой странице."], "sH": "Поддержка", "sIntro": "Нужна помощь? Ниже — ответы на частые вопросы. Вы также можете связаться с разработчиком напрямую (см. «Связаться» ниже).", "faq": [["Нужен ли аккаунт?", "Нет. Приложение работает полностью офлайн и никогда не требует входа."], ["Выгружается ли моё аудио куда-либо?", "Нет. Транскрипция и обработка выполняются на устройстве; аудио не выгружается."], ["Как редактировать звук текстом?", "Транскрибируйте запись и удаляйте слова в тексте — соответствующий звук вырезается. На шкале также можно обрезать, разделять и переставлять."], ["Что открывает Pro?", "Транскрипцию без ограничения длины, редактирование звука по тексту и профессиональный экспорт (WAV / нормализация громкости / видео с осциллограммой). Аудио до 30 секунд — бесплатно."], ["Меняет ли монтаж исходный файл?", "Нет. Монтаж неразрушающий; исходная запись никогда не изменяется."]], "cH": "Связаться", "cIntro": "Вопросы или отзывы? Свяжитесь с разработчиком здесь:"}, "it": {"name": "Registra, trascrivi e modifica", "tag": "Trascrizione e montaggio audio sul dispositivo", "nprivacy": "Privacy", "nsupport": "Assistenza", "nmarketing": "Panoramica", "updated": "Ultimo aggiornamento: 2026-07-04", "mH": "Panoramica", "mBody": ["Registrare → trascrivere → modificare l’audio in un unico posto, tutto sul dispositivo.", "Trascrizione ad alta precisione sul dispositivo con separazione automatica degli interlocutori.", "Modifica l’audio come testo: elimina una parola per tagliare l’audio corrispondente.", "Timeline non distruttiva: ritaglia, dividi, riordina, dissolvenze, volume per segmento.", "Esporta audio lossless (Pro), trascrizioni e video verticale con forma d’onda.", "Senza rete, senza upload, senza account."], "pH": "Informativa sulla privacy", "pBody": ["Questa app è progettata per essere privata per impostazione predefinita. Non raccoglie, memorizza né condivide alcun dato personale.", "Tutta l’elaborazione — registrazione, trascrizione, separazione degli interlocutori e modifica — avviene interamente sul tuo dispositivo. Il tuo audio non viene mai caricato su alcun server.", "Non è richiesto alcun account o accesso. Non ci sono analisi, pubblicità o tracciamento di terze parti.", "I modelli di trascrizione e separazione degli interlocutori sono integrati nell’app e funzionano offline; se un modello viene scaricato, viene recuperato solo il file del modello — il tuo audio non viene mai inviato.", "Registrazioni e modifiche sono salvate solo localmente sul tuo dispositivo (nel contenitore dell’app) e possono essere eliminate in qualsiasi momento nell’app.", "Poiché non raccogliamo alcun dato, dalla nostra parte non esiste alcun dato personale da consultare, correggere o eliminare.", "In caso di modifiche a questa informativa, la versione aggiornata sarà pubblicata su questa pagina."], "sH": "Assistenza", "sIntro": "Ti serve aiuto? Ecco le risposte alle domande frequenti. Puoi anche contattare direttamente lo sviluppatore (vedi «Contatti» qui sotto).", "faq": [["Serve un account?", "No. L’app funziona completamente offline e non richiede mai l’accesso."], ["Il mio audio viene caricato da qualche parte?", "No. Trascrizione ed elaborazione avvengono sul dispositivo; l’audio non viene mai caricato."], ["Come modifico l’audio con il testo?", "Trascrivi una registrazione ed elimina parole nella trascrizione: l’audio corrispondente viene tagliato. Sulla timeline puoi anche ritagliare, dividere e riordinare."], ["Cosa sblocca Pro?", "Trascrizione senza limiti di durata, modifica dell’audio dal testo ed esportazione pro (WAV / normalizzazione del volume / video con forma d’onda). L’audio fino a 30 secondi è gratis."], ["La modifica cambia il file originale?", "No. La modifica è non distruttiva; la registrazione originale non viene mai modificata."]], "cH": "Contatti", "cIntro": "Domande o feedback? Contatta lo sviluppatore qui:"}, "nl": {"name": "Opnemen, transcriberen, editor", "tag": "Transcriptie en audiobewerking op het toestel", "nprivacy": "Privacy", "nsupport": "Ondersteuning", "nmarketing": "Overzicht", "updated": "Laatst bijgewerkt: 2026-07-04", "mH": "Overzicht", "mBody": ["Opnemen → transcriberen → audio bewerken op één plek, volledig op het toestel.", "Nauwkeurige transcriptie op het toestel met automatische sprekerscheiding.", "Bewerk audio als tekst — verwijder een woord om de bijbehorende audio te knippen.", "Niet-destructieve tijdlijn: inkorten, splitsen, herordenen, fades, volume per segment.", "Exporteer lossless audio (Pro), transcripties en verticale golfvorm-video.", "Geen netwerk, geen upload, geen account."], "pH": "Privacybeleid", "pBody": ["Deze app is standaard privacyvriendelijk ontworpen. Er worden geen persoonsgegevens verzameld, opgeslagen of gedeeld.", "Alle verwerking — opnemen, transcriberen, sprekerscheiding en bewerken — gebeurt volledig op je toestel. Je audio wordt nooit naar een server geüpload.", "Er is geen account of aanmelding nodig. Er is geen analyse, advertentie of tracking door derden.", "De modellen voor transcriptie en sprekerscheiding zitten in de app en werken offline; als een model wordt gedownload, wordt alleen het modelbestand opgehaald — je audio wordt nooit verzonden.", "Opnames en bewerkingen worden alleen lokaal op je toestel opgeslagen (in de container van de app) en kun je op elk moment in de app verwijderen.", "Omdat we geen gegevens verzamelen, zijn er aan onze kant geen persoonsgegevens om in te zien, te corrigeren of te verwijderen.", "Als dit beleid verandert, wordt de bijgewerkte versie op deze pagina geplaatst."], "sH": "Ondersteuning", "sIntro": "Hulp nodig? Hier zijn antwoorden op veelgestelde vragen. Je kunt de ontwikkelaar ook rechtstreeks bereiken (zie ‘Contact’ hieronder).", "faq": [["Heb ik een account nodig?", "Nee. De app werkt volledig offline en vereist nooit aanmelding."], ["Wordt mijn audio ergens geüpload?", "Nee. Transcriptie en verwerking gebeuren op het toestel; audio wordt nooit geüpload."], ["Hoe bewerk ik audio via tekst?", "Transcribeer een opname en verwijder woorden in de transcriptie — de bijbehorende audio wordt geknipt. Op de tijdlijn kun je ook inkorten, splitsen en herordenen."], ["Wat ontgrendelt Pro?", "Transcriptie zonder lengtebeperking, tekstgebaseerde audiobewerking en pro-export (WAV / luidheidsnormalisatie / golfvorm-video). Audio tot 30 seconden is gratis."], ["Verandert bewerken mijn originele bestand?", "Nee. Bewerken is niet-destructief; je originele opname wordt nooit gewijzigd."]], "cH": "Contact", "cIntro": "Vragen of feedback? Bereik de ontwikkelaar hier:"}, "tr": {"name": "Kayıt, deşifre ve düzenleme", "tag": "Cihazda deşifre ve ses düzenleme", "nprivacy": "Gizlilik", "nsupport": "Destek", "nmarketing": "Genel Bakış", "updated": "Son güncelleme: 2026-07-04", "mH": "Genel Bakış", "mBody": ["Kaydet → metne dök → sesi düzenle, tek yerde ve tamamen cihazda.", "Cihazda yüksek doğruluklu deşifre ve otomatik konuşmacı ayırma.", "Sesi metin gibi düzenleyin — bir kelimeyi silin, karşılık gelen ses kesilsin.", "Tahrip etmeyen zaman çizelgesi: kırpma, bölme, yeniden sıralama, geçişler, bölüm bazında ses.", "Kayıpsız ses (Pro), metin ve dikey dalga formu videosu dışa aktarın.", "Ağ yok, yükleme yok, hesap yok."], "pH": "Gizlilik Politikası", "pBody": ["Bu uygulama varsayılan olarak gizli olacak şekilde tasarlanmıştır. Hiçbir kişisel veriyi toplamaz, saklamaz veya paylaşmaz.", "Kayıt, deşifre, konuşmacı ayırma ve düzenleme dahil tüm işleme tamamen cihazınızda yapılır. Sesiniz asla bir sunucuya yüklenmez.", "Hesap veya oturum açma gerekmez. Analiz, reklam veya üçüncü taraf takibi yoktur.", "Deşifre ve konuşmacı ayırma modelleri uygulamaya gömülüdür ve çevrimdışı çalışır; bir model indirilirse yalnızca model dosyası alınır — sesiniz asla gönderilmez.", "Kayıtlar ve düzenlemeler yalnızca cihazınızda (uygulamanın kapsayıcısında) yerel olarak saklanır ve uygulama içinde istediğiniz zaman silebilirsiniz.", "Hiçbir veri toplamadığımız için tarafımızda erişilecek, düzeltilecek veya silinecek kişisel veri bulunmaz.", "Bu politika değişirse güncel sürüm bu sayfada yayımlanır."], "sH": "Destek", "sIntro": "Yardım mı gerekiyor? Sık sorulan soruların yanıtları burada. Geliştiriciye doğrudan da ulaşabilirsiniz (aşağıdaki ‘İletişim’e bakın).", "faq": [["Hesap gerekli mi?", "Hayır. Uygulama tamamen çevrimdışı çalışır ve asla oturum açma gerektirmez."], ["Sesim bir yere yükleniyor mu?", "Hayır. Deşifre ve işleme cihazda yapılır; ses asla yüklenmez."], ["Sesi metinle nasıl düzenlerim?", "Bir kaydı deşifre edin ve metinde kelimeleri silin — karşılık gelen ses kesilir. Zaman çizelgesinde ayrıca kırpabilir, bölebilir ve yeniden sıralayabilirsiniz."], ["Pro neyi açar?", "Süre sınırı olmayan deşifre, metinle ses düzenleme ve profesyonel dışa aktarma (WAV / ses düzeyi normalleştirme / dalga formu videosu). 30 saniyeye kadar ses ücretsizdir."], ["Düzenleme özgün dosyamı değiştirir mi?", "Hayır. Düzenleme tahrip etmez; özgün kaydınız asla değiştirilmez."]], "cH": "İletişim", "cIntro": "Sorularınız veya geri bildirimleriniz mi var? Geliştiriciye buradan ulaşın:"}};
const LN={"en": "English", "zh-Hans": "简体中文", "zh-Hant": "繁體中文", "ja": "日本語", "ko": "한국어", "de": "Deutsch", "fr": "Français", "es": "Español", "pt": "Português", "ru": "Русский", "it": "Italiano", "nl": "Nederlands", "tr": "Türkçe"};
function pick(){const u=new URLSearchParams(location.search);let l=u.get('lang');if(l&&D[l])return l;
  const n=(navigator.language||'en');if(D[n])return n;const base=n.split('-')[0];
  const map={zh:(n.toLowerCase().includes('hant')||n.toLowerCase().includes('tw')||n.toLowerCase().includes('hk'))?'zh-Hant':'zh-Hans',pt:'pt'};
  if(map[base]&&D[map[base]])return map[base];if(D[base])return base;return 'en';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(l){const d=D[l];document.documentElement.lang=l;
  document.getElementById('brand').textContent=d.name;
  document.getElementById('tag').textContent=d.tag;
  document.getElementById('navm').textContent=d.nmarketing;
  document.getElementById('navp').textContent=d.nprivacy;
  document.getElementById('navs').textContent=d.nsupport;
  document.getElementById('mH').textContent=d.mH;
  document.getElementById('mBody').innerHTML=d.mBody.map(x=>'<li>'+esc(x)+'</li>').join('');
  document.getElementById('pH').textContent=d.pH;
  document.getElementById('pBody').innerHTML=d.pBody.map(x=>'<p>'+esc(x)+'</p>').join('');
  document.getElementById('updated').textContent=d.updated;
  document.getElementById('sH').textContent=d.sH;
  document.getElementById('sIntro').textContent=d.sIntro;
  document.getElementById('faq').innerHTML=d.faq.map(q=>'<b>'+esc(q[0])+'</b><p>'+esc(q[1])+'</p>').join('');
  document.getElementById('cH').textContent=d.cH;
  document.getElementById('cIntro').textContent=d.cIntro;
  document.getElementById('foot').textContent=d.name+' · '+d.updated;
  const sel=document.getElementById('langsel');
  if(!sel.options.length){for(const k in D){const o=document.createElement('option');o.value=k;o.textContent=LN[k]||k;sel.appendChild(o);}}
  sel.value=l;
}
const sel=document.getElementById('langsel');
sel.addEventListener('change',()=>{const l=sel.value;const u=new URLSearchParams(location.search);u.set('lang',l);
  history.replaceState(null,'','?'+u.toString()+location.hash);render(l);});
render(pick());
if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView();}
</script>
